  .card{top:auto!important;bottom:calc(var(--tlh,84px) + 18px)!important;max-height:none!important;overflow:visible!important;padding:8px 12px 8px!important}
  .card .kicker{font-size:11px!important}

</style>
<script>
(function(){
  var card=document.querySelector('aside.card'), tl=document.querySelector('.tl');
  if(!card) return;
  var b=document.createElement('button'); b.className='mtoggle'; b.type='button'; b.textContent='解説 ▾';
  b.addEventListener('click',function(e){ e.stopPropagation(); var o=card.classList.toggle('open'); b.textContent=o?'閉じる ▴':'解説 ▾'; });
  card.insertBefore(b,card.firstChild);
  function fit(){ if(tl) document.documentElement.style.setProperty('--tlh',tl.offsetHeight+'px'); }
  addEventListener('resize',fit); fit(); setTimeout(fit,500);
})();
</script>
