  for(const P of SHISA_PASS){ const bi=P.i(); if(T<bi-0.5) P.t0=null; if(P.t0==null&&at(bi)) P.t0=now; if(P.t0==null) continue; const f=(now-P.t0)/D; if(f<0||f>1) continue;

  for(const em of emitters){ const n=Math.floor(em.rate*dt+Math.random()*em.rate*dt); for(let k=0;k<n;k++) smoke.spawn(em.p[0],em.p[1],em.p[2],0.5+Math.random()*0.3,1.0+Math.random()*0.6,(Math.random()-0.5)*0.3,4+Math.random()*2,em.s,em.s*3.5,em.dark?0.8:0.45); }
  smoke.update(dt,0.05); embers.update(dt,-0.4); soil.update(dt,-4);
  if(strongest){ fireLight.position.set(strongest.p.x,strongest.p.y+3,strongest.p.z); fireLight.intensity=3.2*strongest.i*(0.8+Math.random()*0.3); } else fireLight.intensity=0;
  const vig=1-ss(0,0.45,Math.abs(T-BURY)); vigEl.style.opacity=vig.toFixed(3);
  sun.intensity=(1.15-0.3*vig)*(1-0.5*ENDK); hemi.intensity=(0.62-0.12*vig)*(1-0.4*ENDK); sun.color.setRGB(1-0.3*ENDK,0.94-0.22*ENDK,0.82+0.08*ENDK);
  waterTex.offset.x+=dt*0.003;
  clouds.forEach(c=>{ c.m.position.x=c.x+Math.sin(time*0.05+c.i)*2.5; });
  if(orbit.auto&&!drag&&now-orbit.lastUser>6000) orbit.tTheta+=dt*(rec?0.004:0.02);
  applyCamera(); renderer.render(scene,camera);
  if(rec){ cx2.drawImage(recBg(),0,0); cx2.drawImage(canvas,0,0,rec.W,rec.H); drawOverlay(cx2,rec.W,rec.H,T,y,now); }
  else { updateCard(T); updateLabels(T,y); }
  requestAnimationFrame(frame);
}
frame();
if(!reduced) setTimeout(()=>{ if(!playing&&T===0&&!tw&&!rec) startPlay(); },1800);
})();
</script>
