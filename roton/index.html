function animReady(A){return A&&A.imgs.length&&A.imgs[0].complete&&A.imgs[0].naturalWidth>0;}
function animFrame(A,ph){
  const n=A.imgs.length,cyc=2*n-2;
  let f=Math.floor(ph)%cyc; if(f<0)f+=cyc;
  if(f>=n)f=cyc-f;
  return A.imgs[f];
}
function drawAnim(key,x,y,scale,flip,ph){
  const A=ANIM[key]; if(!animReady(A))return;
  const img=animFrame(A,(ph!==undefined)?ph:t*A.fps);
  const h=A.h*(scale||1), w=img.naturalWidth*(h/img.naturalHeight);
  ctx.save();
  ctx.translate(x,y);
  if(flip)ctx.scale(-1,1);
  ctx.drawImage(img,-w/2,-h,w,h);
  ctx.restore();
  return {w:w,h:h};
}

/* ================= 音（合成＋素材） ================= */
let AC=null,master=null,amb=null,songBuf=null,songNode=null,songGain=null;
function initAudio(){
  if(AC){if(AC.state!=='running'){try{AC.resume();}catch(e){}}loadSong();loadSE();return;}
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=0.85;master.connect(AC.destination);
  const nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),nd=nb.getChannelData(0);
  for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  amb={};
  amb.night=noiseLayer(nb,'bandpass',1800,1.2,0);   /* 虫の音 */
  amb.gtr=noiseLayer(nb,'bandpass',700,3.5,0.3);    /* 遠くのギター（予告） */
  loadSong();loadSE();
}
function noiseLayer(buf,type,freq,q,pan){
  const s=AC.createBufferSource();s.buffer=buf;s.loop=true;
  const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
  const g=AC.createGain();g.gain.value=0;
  const p=AC.createStereoPanner();p.pan.value=pan;
  s.connect(f);f.connect(g);g.connect(p);p.connect(master);s.start();
  return {gain:g,filter:f,pan:p};
}
function env(g,t0,a,peak,dur){
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak),t0+a);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
}
function tone(f,type,peak,dur,slide){
  if(!AC)return;
  const t0=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.linearRampToValueAtTime(f*slide,t0+dur);
  env(g,t0,0.01,peak,dur);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+0.1);
}
function pickTone(){tone(880,'triangle',0.05,0.18,1.25);}
function gtrNote(f){
  if(!AC)return;
  const t0=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),ft=AC.createBiquadFilter();
  o.type='sawtooth';o.frequency.value=f;
  ft.type='lowpass';ft.frequency.setValueAtTime(2600,t0);ft.frequency.exponentialRampToValueAtTime(600,t0+0.25);
  env(g,t0,0.005,0.09,0.3);
  o.connect(ft);ft.connect(g);g.connect(master);o.start(t0);o.stop(t0+0.4);
}
function accordionNote(f){
  if(!AC)return;
  const t0=AC.currentTime;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;lp.connect(master);
  [[1,0.05],[1.005,0.04],[2,0.02],[3,0.012]].forEach(([m,v],i)=>{   /* 本物のリードは僅かにうなる */
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='sawtooth';o.frequency.value=f*m;
    env(g,t0,0.12,v,1.4);
    o.connect(g);g.connect(lp);o.start(t0);o.stop(t0+1.7);
  });
}
function thud(){
  if(!AC)return;
  const t0=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type='sine';o.frequency.setValueAtTime(150,t0);o.frequency.exponentialRampToValueAtTime(45,t0+0.25);
  env(g,t0,0.005,0.28,0.35);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+0.5);
}
function fanfare(){ /* 場違いに豪華な得点音 */
  if(!AC)return;
  const t0=AC.currentTime;
  [523,659,784,1047].forEach((f,i)=>{
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='square';o.frequency.value=f;
    env(g,t0+i*0.06,0.01,0.055,0.5);
    o.connect(g);g.connect(master);o.start(t0+i*0.06);o.stop(t0+i*0.06+0.6);
  });
}
function hum(){tone(300,'sine',0.03,0.12,1.15);}
/* レベルアップ級の祝福音（大袈裟でよい） */
function levelUp(){
  if(!AC)return;
  const t0=AC.currentTime;
  const seq=[523,659,784,1046,1318,1568,2093];
  seq.forEach((f,i)=>{
    const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;
    env(g,t0+i*0.07,0.005,0.07,0.22);o.connect(g);g.connect(master);o.start(t0+i*0.07);o.stop(t0+i*0.07+0.3);
    const o2=AC.createOscillator(),g2=AC.createGain();o2.type='triangle';o2.frequency.value=f*2;

/* 墓石型のフレーム（上が丸い・欠けと苔） */
function tombFrame(x,y,w,h,seed){
  const r=w*0.5;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x,y+h);ctx.lineTo(x,y+r);
  ctx.arc(x+r,y+r,r,Math.PI,0);
  ctx.lineTo(x+w,y+h);ctx.closePath();
  ctx.fillStyle='#6E6A63';ctx.fill();
  ctx.clip();
  /* 石の斑と苔 */
  for(let i=0;i<16;i++){
    const a=(seed*7+i*53)%97/97, b=(seed*11+i*29)%89/89;
    ctx.fillStyle='rgba(40,44,36,'+(0.05+0.05*a).toFixed(2)+')';
    ctx.beginPath();ctx.ellipse(x+w*a,y+h*b,10+18*b,6+10*a,a*3,0,6.29);ctx.fill();
  }
  ctx.fillStyle='rgba(96,120,70,0.30)';
  ctx.beginPath();ctx.ellipse(x+w*0.12,y+h*0.92,w*0.26,h*0.10,0,0,6.29);ctx.fill();
  ctx.restore();
  /* 縁と欠け */
  ctx.strokeStyle='rgba(30,28,26,0.75)';ctx.lineWidth=2.5;
  ctx.beginPath();
  ctx.moveTo(x,y+h);ctx.lineTo(x,y+r);
  ctx.arc(x+r,y+r,r,Math.PI,0);
  ctx.lineTo(x+w,y+h);
  ctx.stroke();
  ctx.fillStyle='rgba(12,10,14,0.85)';
  ctx.beginPath();ctx.moveTo(x+w*0.76,y+2);ctx.lineTo(x+w*0.93,y+16);ctx.lineTo(x+w*0.99,y+3);ctx.closePath();ctx.fill();
}
function drawTalk(){
  if(!talk)return;
  const L=talk.lines[talk.i]; if(!L)return;
  const who=L.who, left=(who!=='roton');
  const FW=196,FH=232, FX=left?34:W-34-FW, FY=H-24-FH;
  /* 顔（墓石フレーム） */
  tombFrame(FX,FY,FW,FH,who.length);
  const key='f_'+who;
  if(ok(key)){
    const im=IMG[key];
    const pad=16, aw=FW-pad*2, ah=FH-pad*2-14;
    const sc=Math.min(aw/im.naturalWidth, ah/im.naturalHeight);
    const w2=im.naturalWidth*sc, h2=im.naturalHeight*sc;
    ctx.save();
    ctx.translate(FX+FW/2,FY+pad+ah/2);
    const ff=(who==='orochi');            /* 左向きの顔グラは反転の向きが逆 */
    if(left?ff:!ff)ctx.scale(-1,1);
    ctx.drawImage(im,-w2/2,-h2/2,w2,h2);
    ctx.restore();
  }
  /* 銘＝名前 */
  serif(17,4);ctx.textAlign='center';ctx.fillStyle='#E4DCC8';
  ctx.fillText(NAMES[who]||'',FX+FW/2,FY+FH-14);
  resetLS();
  /* 吹き出し（骨白の紙） */
  const BX=left?FX+FW+16:120, BW=W-FW-70-102, BY=H-24-150, BH=118;
  ctx.fillStyle='rgba(240,236,222,0.94)';
  ctx.beginPath();
  ctx.moveTo(BX,BY+10);ctx.lineTo(BX+BW,BY+4);ctx.lineTo(BX+BW-6,BY+BH);ctx.lineTo(BX+4,BY+BH-6);ctx.closePath();
  ctx.fill();
  ctx.strokeStyle='rgba(90,80,70,0.5)';ctx.lineWidth=1.5;ctx.stroke();
  /* しっぽ（話者側へ） */
  ctx.fillStyle='rgba(240,236,222,0.94)';
  ctx.beginPath();
  if(left){ctx.moveTo(BX+2,BY+40);ctx.lineTo(BX-16,BY+56);ctx.lineTo(BX+4,BY+70);}
  else{ctx.moveTo(BX+BW-2,BY+40);ctx.lineTo(BX+BW+16,BY+56);ctx.lineTo(BX+BW-4,BY+70);}
  ctx.closePath();ctx.fill();
  /* 本文 */
  const line=L.text||'';
  const n=Math.min(line.length,Math.floor(talk.t*28));
  serif(23,3);ctx.textAlign='left';ctx.fillStyle='#2C2620';
  const maxw=BW-52;
  let row=0,buf='';
  for(const ch of line.slice(0,n)){
    if(ctx.measureText(buf+ch).width>maxw){ctx.fillText(buf,BX+26,BY+52+row*34);row++;buf=ch;}
    else buf+=ch;
  }
  ctx.fillText(buf,BX+26,BY+52+row*34);
  resetLS();
  if(n>=line.length&&Math.sin(t*6)>0){
    ctx.fillStyle='rgba(60,50,40,0.8)';
    ctx.beginPath();ctx.moveTo(BX+BW-30,BY+BH-22);ctx.lineTo(BX+BW-18,BY+BH-22);ctx.lineTo(BX+BW-24,BY+BH-13);ctx.fill();
  }
}

const LIVE_START=0.0; let LIVE_END=122.0;   /* ライブ＝アニメのED本編そのもの（音声つき映像） */
function buildLive(){
  const C=chartED||chart;
  LIVE_END=115.5;   /* 星座のロトンまで。エンドクレジットの手前で止める */
  const src=(C&&C.sections&&C.sections.live)?C.sections.live.notes:[];
  let ns=src.filter(n=>n.t>=LIVE_START&&n.t<=108.5).map(n=>({t:n.t-LIVE_START,s:n.s,type:n.type,dur:n.dur,t2:n.t2,hit:false,miss:false,held:0}));
  if(!ns.length){for(let i=0;i<40;i++)ns.push({t:2+i*1.1,s:0.6,type:'tap',hit:false,miss:false,held:0});}
  /* 覚えた技をノーツに反映。長く空く強音＝長押し／終盤の強音＝連打（曲の後半ほど厚く） */
  const L=ns[ns.length-1].t||100;
  for(let i=0;i<ns.length;i++){
    const n=ns[i], nxt=(i+1<ns.length)?ns[i+1].t:n.t+3, gap=nxt-n.t, pos=n.t/L;
    if(n.type!=='tap')continue;
    if(skills.bang&&gap>=0.7&&n.s>0.55&&(pos>0.4)&&Math.random()<0.6){n.type='mash';n.dur=Math.min(1.2,gap-0.28);n.need=pos>0.75?7:5;continue;}
    if(skills.bang&&gap>=0.48&&n.s>0.5&&(pos>0.68)&&Math.random()<0.8){n.type='mash';n.dur=gap-0.18;n.need=4;continue;}
    if(skills.bang&&gap>=0.34&&(pos>0.85)&&Math.random()<0.7){n.type='mash';n.dur=gap-0.14;n.need=3;continue;}
    if(skills.solo&&gap>=0.8&&n.s>0.45&&Math.random()<0.5){n.type='hold';n.dur=Math.min(1.4,gap-0.28);continue;}
  }
  for(const n of ns){if(n.type==='mash'&&!n.need)n.need=6;if(n.type==='hold'&&!n.dur)n.dur=0.8;}
  return ns;
}

function judge(kind,n){
  const col=kind==='PERFECT'?'#FFE27A':kind==='GREAT'?'#8FD8FF':'#9a9096';
  judges.push({s:kind==='woop'?'woop…':kind+'!',T:0.8,max:0.8,x:170,y:82,col:col,big:kind==='PERFECT'});

function liveTap(){
  if(!mg||mg.k!=='live'||mg.done)return true;
  const cur=mg.cur||0;
  /* 連打バーの中なら、連打として数える */
  for(const n of mg.notes){
    if(n.type==='mash'&&!n.hit&&!n.miss&&cur>=n.t-0.14&&cur<=n.t+n.dur+0.12){
      n.held++;mashTick();
      for(let i=0;i<2;i++)sparks.push({x:170+Math.random()*20-10,y:82,vx:Math.random()*120-60,vy:-40-Math.random()*80,T:.35,max:.35,s:.7});
      if(n.held>=n.need){n.hit=true;mg.hit++;judge('PERFECT',n);liveFx(n);}
      return true;
    }
  }
  let best=null,bd=1e9;
  for(const n of mg.notes){
    if(n.hit||n.miss||n.holding)continue;
    if(n.type==='mash')continue;
    const tt=(n.type==='seq'&&n.held>0)?n.t2:n.t;
    const d=Math.abs(tt-cur);
    if(d<bd){bd=d;best=n;}
  }
  if(best&&bd<0.14){
    const grade=bd<0.06?'PERFECT':'GREAT';
    if(best.type==='hold'){best.holding=true;best.grade=grade;tone(1760,'sine',0.012,0.08);}
    else if(best.type==='seq'){best.held++;if(best.held>=2){best.hit=true;mg.hit++;judge(grade,best);liveFx(best);}else{tone(1320,'sine',0.012,0.06);}}
    else{best.hit=true;mg.hit++;judge(grade,best);liveFx(best);}
  }else{mg.miss++;judge('woop',null);}
  return true;
}

        if(guide.T>3.5)guide=null;

    }
    /* 屋台バー */
    if(guideDone&&!mg&&!dlg&&!talk&&!pendingScene){
      const near=Math.abs(player.x-SPOT.bar.x)<48;
      if(near&&!barCool){say(['……屋台？　こんな所に'],()=>go('bar',300,480));barCool=true;}
      if(!near&&Math.abs(player.x-SPOT.bar.x)>140)barCool=false;
    }
    /* ゾンビール */
    for(const c of cans){
      if(!c.got&&Math.abs(c.x-player.x)<26&&Math.abs(c.y-player.y)<40&&!dlg&&!talk&&!mg){
        c.got=true;cansHeld++;tension=Math.min(3,tension+1);pickLock=0.6;drinkT=2.2;
        say(['……いただきます'],()=>{if(!se('paku',0.9))tone(520,'sine',0.05,0.5,1.4);});
      }
    }
    const busy=mg||dlg||talk||bigNum||pickLock>0;
    /* 場A ミタマ（歌詞の木） */
    if(!skills.lyric&&!busy&&!met.mitama&&Math.abs(player.x-SPOT.tree.x)<58){
      met.mitama=true;pickLock=0.3;
      talkTo([
        {who:'mitama',text:'やぁ、君、同じ匂いがするね'},
        {who:'roton', text:'……どうも'},
        {who:'mitama',text:'ちょっと手伝ってくんない？　新しい曲の歌詞を作ってるんだけど……'},
        {who:'roton', text:'実が……言葉を、囁いている'}
      ],()=>startMG('lyric'));
    }
    /* 場B ナルカミ（速弾き） */
    if(!skills.solo&&!busy&&!met.narukami&&Math.abs(player.x-SPOT.rock.x)<58){
      met.narukami=true;pickLock=0.3;
      talkTo([
        {who:'narukami',text:'お前、ギター弾けるのか？'},
        {who:'roton',   text:'え、まぁ……たしなむ程度なら……'},
        {who:'narukami',text:'やってみろ'}
      ],()=>startMG('solo'));
    }
    /* 場C リーリー（ヘドバン） */
    if(!skills.bang&&!busy&&!met.lili&&Math.abs(player.x-SPOT.bones.x)<58){
      met.lili=true;pickLock=0.3;
      talkTo([
        {who:'lili', text:'あ、お客さん！　ここ、骨が鳴るんだよ'},
        {who:'roton',text:'骨は……楽器にもなる'},
        {who:'lili', text:'わかってるね！　じゃあ、練習！　高速ヘドバン！'},
        {who:'lili', text:'キーを連打して！！　止まったら負けだよ！'}
      ],()=>startMG('bang'));
    }
    /* 場D マカミ（ベースライン当て） */
    if(!skills.bass&&!busy&&!met.makami&&Math.abs(player.x-SPOT.bass.x)<58){
      met.makami=true;pickLock=0.3;
      talkTo([
        {who:'makami',text:'……いい骨だ'},
        {who:'roton', text:'気持ちはわかる。俺も骨だ'},
        {who:'makami',text:'……真似できる？'}
      ],()=>startMG('bass'));
    }
    /* 出口 */
    const all=skills.lyric&&skills.solo&&skills.bang&&skills.bass;
    if(all&&!dlg&&!talk&&!mg&&player.x>SPOT.exit.x){
      if(!exitTold){exitTold=true;say(['……行こう。','夏の終わりの、ステージへ'],()=>{go('stage',300,470);});}
    }else if(!all&&player.x>SPOT.exit.x){player.x=SPOT.exit.x;}
    /* 道しるべ: 8秒迷ったら火の玉が未達の場へ */
    if(idleT>8&&!leadFire.on&&!dlg&&!mg){
      const tgt=!skills.lyric?SPOT.tree:!skills.solo?SPOT.rock:!skills.bang?SPOT.bones:SPOT.exit;
      leadFire={x:player.x,y:player.y-60,on:true,tx:tgt.x,T:0};
    }
    if(leadFire.on){
      leadFire.T+=dt;
      const d=leadFire.tx-leadFire.x;
      leadFire.x+=Math.sign(d)*Math.min(Math.abs(d),110*dt);
      leadFire.y+=Math.sin(t*3)*12*dt;
      if(idleT<0.2||leadFire.T>7)leadFire.on=false;
    }
  }

  /* 仲間の追従（数珠つなぎ）※ステージでは定位置 */
  if(scene!=='stage')for(let i=0;i<partyPos.length;i++){
    const p=partyPos[i];
    const lead=(i===0)?{x:player.x,y:player.y}:partyPos[i-1];
    const off=(player.dir==='left')?42:-42;
    const tx=lead.x+off,ty=lead.y+(i%2?6:-4);
    const ax=tx-p.x,ay=ty-p.y,d=Math.hypot(ax,ay);
    if(d>46){p.flip=ax<0;p.x+=ax/d*Math.min(d,150*dt);p.y+=ay/d*Math.min(d,150*dt);p.mov=0.15;}else if(p.mov>0)p.mov-=dt;
  }

  /* ミニゲーム */
  if(mg&&!mg.done){
    mg.T+=dt;
    if(mg.k==='lyric'){
      mg.spawnT-=dt;
      if(mg.spawnT<=0){
        mg.spawnT=1.15;
        const slot=['A','B','C'][Math.floor(Math.random()*3)];
        const arr=FRAG[slot];
        mg.fruit.push({x:SPOT.tree.x+(Math.random()*300-150),y:SPOT.tree.y-260,vy:0,slot:slot,word:arr[Math.floor(Math.random()*arr.length)],got:false,T:0});
      }
      for(const f of mg.fruit){f.T+=dt;f.vy+=42*dt;f.y+=f.vy*dt;}
      mg.fruit=mg.fruit.filter(f=>!f.got&&f.y<SPOT.tree.y+30);
    }else if(mg.k==='solo'){
      if(mg.startedAt===null){
        mg.wait=(mg.wait||0)+dt;
        if(songBuf&&mg.T>0.35)mg.startedAt=playSongFrom(SOLO_START,0.62);
        else if(mg.wait<3.0){mg.T=Math.min(mg.T,0.34);}   /* 曲が来るまで最大3秒待つ。来なければ無音で進む */
      }
      const cur=mgClock(0.35);
      mg.cur=cur;
      for(const n of mg.notes){if(!n.hit&&!n.miss&&cur>n.t+0.12){n.miss=true;mg.miss++;}}
      if(cur>mg.len){stopSong();finishSolo();}
    }else if(mg.k==='bass'){
      mg.showT+=dt;
      if(mg.litT>0)mg.litT-=dt;
      if(mg.phase==='show'){
        const idx=Math.floor(mg.showT/(gear.earplug?0.95:0.62));
        if(idx<mg.seq.length){
          if(mg.shown!==idx){mg.shown=idx;mg.lit=mg.seq[idx];mg.litT=gear.earplug?0.85:0.5;bassNote(mg.seq[idx]);}
        }else{mg.phase='input';mg.step=0;mg.shown=-1;mg.lit=-1;}
      }else if(mg.phase==='wait'){
        if(mg.showT>0.8)bassNextRound();
      }
    }else if(mg.k==='bang'){
      if(mg.T>(gear.neck?15:10))finishBang();
    }
  }

  /* ライブ（音ゲー） */
  if(scene==='stage'&&live){
    live.T+=dt;
    if(live.phase===1&&mg&&mg.k==='live'&&!mg.done){
      mg.T+=dt;
      /* 時計＝映像の再生位置。映像が動かない時は内部時計で進める（止まらない） */
      if(MV.readyState>=2&&!MV.paused&&!MV.ended){mg.cur=Math.max(mg.lastC,MV.currentTime);mg.lastC=mg.cur;mg.T=mg.cur;}
      else{mg.wait=(mg.wait||0)+dt;if(mg.wait>2.5){mg.cur=Math.max(mg.lastC,mg.T);mg.lastC=mg.cur;}else{mg.T=Math.min(mg.T,0.01);mg.cur=0;}
           if(MV.paused&&!MV.ended){try{MV.play().catch(()=>{});}catch(e){}}}
      mg.heat=Math.max(0,(mg.heat||0)-dt*(gear.charm?0.02:0.06));
      live.crowd=Math.min(1,0.25+(mg.heat||0));
      if(mg.flash>0)mg.flash-=dt;
      for(const n of mg.notes){
        if(n.hit||n.miss)continue;
        if(n.holding){
          const frac=(mg.cur-n.t)/n.dur;
          if(!inputDown){n.holding=false;
            if(frac>=0.92){n.hit=true;mg.hit++;judge(n.grade,n);liveFx(n);}
            else if(frac>=0.5){n.hit=true;mg.hit++;judge('GREAT',n);liveFx(n);}
            else{n.miss=true;mg.miss++;judge('woop',n);}
          }else if(frac>=1){n.holding=false;n.hit=true;mg.hit++;judge(n.grade,n);liveFx(n);}
          continue;
        }
        const late=n.type==='mash'?(n.dur+0.12):(n.type==='seq'?0.55:0.16);
        if(mg.cur>n.t+late){n.miss=true;mg.miss++;judge('woop',n);}
      }
      if(mg.cur>mg.len||MV.ended){
        const res={hit:mg.hit,perfect:mg.perfect||0,miss:mg.miss,total:mg.notes.length};
        mg.done=true;mg=null;
        try{MV.pause();}catch(e){}
        live.phase=3;live.T=0;live.res=res;
        clearScr={T:0,res:res};
        drumRoll(1.8);setTimeout(()=>{se('bakuhatsu',0.8);if(!se('levelup',1.0))levelUp();se('jajaan',0.9,0.9);crash();},1800);
        for(let i=0;i<80;i++)motes.push({x:W/2+(Math.random()*700-350),y:H/2+(Math.random()*100-50),vx:Math.random()*200-100,vy:-100-Math.random()*220,T:3.0,max:3.0,c:['#FFE68A','#FF9AB0','#9AE6FF','#C8FF9A'][i%4]});
      }
    }
  }
  if(clearScr){clearScr.T+=dt;}
  /* エンディング */
  if(scene==='ending'){
    endT+=dt;
    if(endPhase===0&&endT>1.6){endPhase=1;say(['……ふっ。後の祭りか'],()=>{endT=0;endPhase=2;});}
    else if(endPhase===2&&endT>1.0){endPhase=3;endT=0;say(['長い旅だった……'],()=>{endT=0;endPhase=4;});}
    else if(endPhase===4&&endT>3.4){thud();endPhase=5;endT=0;}
  }

  /* フェード */
  if(fadeDir!==0){
    fade+=fadeDir*dt;
    if(fade<=0){fade=0;fadeDir=0;}
    if(fade>=1&&pendingScene){fade=1;switchScene();}
  }

  /* 環境音 */
  if(amb){
    const night=(scene==='grave'||scene==='stage')?0.012:(scene==='alley'?0.006:0.002);
    amb.night.gain.gain.value+=(night-amb.night.gain.gain.value)*Math.min(1,dt*1.2);
    let g=0;
    if(scene==='grave')g=0.004+0.020*Math.max(0,Math.min(1,player.x/GRAVE_W));
    if(scene==='stage')g=0;
    amb.gtr.gain.gain.value+=(g-amb.gtr.gain.gain.value)*Math.min(1,dt*1.2);
  }
}

function bg(k,ox){
  if(!ok(k)){ctx.fillStyle='#1a1520';ctx.fillRect(0,0,W,H);return;}
  const im=IMG[k];
  if(ox===undefined){ctx.drawImage(im,0,0,W,H);}
  else{ctx.drawImage(im,0,0,im.naturalWidth,im.naturalHeight,-ox,0,GRAVE_W,H);}
}
function glow(x,y,rx,ry,base,col){
  const fl=base*(0.7+0.3*Math.sin(t*1.5+x*0.01));
  const c=col||'255,244,205';
  const gg=ctx.createRadialGradient(x,y,2,x,y,rx);
  gg.addColorStop(0,'rgba('+c+','+fl.toFixed(3)+')');
  gg.addColorStop(0.5,'rgba('+c+','+(fl*0.42).toFixed(3)+')');
  gg.addColorStop(1,'rgba('+c+',0)');
  ctx.save();ctx.translate(x,y);ctx.scale(1,ry/rx);ctx.translate(-x,-y);
  ctx.fillStyle=gg;ctx.beginPath();ctx.arc(x,y,rx,0,6.29);ctx.fill();ctx.restore();
}
function fireball(x,y,ph,s){
  const b=0.6+0.4*Math.sin(t*3+ph);
  glow(x,y+Math.sin(t*1.6+ph)*6,26*(s||1),22*(s||1),0.5*b,'150,220,255');
  ctx.fillStyle='rgba(210,245,255,'+(0.75*b).toFixed(2)+')';
  ctx.beginPath();ctx.arc(x,y+Math.sin(t*1.6+ph)*6,6*(s||1),0,6.29);ctx.fill();
}

    }
    /* 場B ナルカミ（未加入なら岩の上） */
    const gs=SCALE.grave*1.1;
    if(!party.includes('narukami'))drawAnim('narukami',SPOT.rock.x-camX,SPOT.rock.y-96,gs*CHAR_SC.narukami,false);
    if(!party.includes('lili'))drawAnim('lili',SPOT.bones.x-camX,SPOT.bones.y,gs*CHAR_SC.lili,false);
    if(!party.includes('makami'))drawAnim('makami',SPOT.bass.x-camX,SPOT.bass.y,gs*CHAR_SC.makami,true);
    if(!party.includes('mitama')&&met.mitama)drawAnim('mitama',SPOT.tree.x-camX+90,SPOT.tree.y-30,gs*CHAR_SC.mitama,true);
    if(!met.mitama&&mg===null){
      /* 実がひとつ、ゆっくり明滅している（近づけ、の合図） */
      glow(SPOT.tree.x-camX,SPOT.tree.y-210,54,46,0.26,'205,175,225');
    }
    /* 屋台バーの入口＝赤提灯 */
    if(guideDone){
      const bx=SPOT.bar.x-camX;
      glow(bx,400,80,70,0.35,'255,90,70');
      for(let i=0;i<2;i++){const lx=bx-22+i*44,ly=372+Math.sin(t*2+i)*3;
        ctx.fillStyle='#C8322E';ctx.beginPath();ctx.ellipse(lx,ly,11,15,0,0,6.29);ctx.fill();
        ctx.strokeStyle='rgba(60,10,10,0.6)';ctx.lineWidth=1;ctx.stroke();
        ctx.fillStyle='rgba(255,230,180,0.35)';ctx.beginPath();ctx.ellipse(lx-3,ly-3,4,7,0,0,6.29);ctx.fill();}
      ctx.strokeStyle='rgba(40,30,30,0.7)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx-40,352);ctx.lineTo(bx+40,352);ctx.stroke();
      if(!mg&&!dlg&&!talk&&!gear.pick&&!gear.neck&&!gear.earplug&&!gear.charm)marker(bx,320);
    }
    if(leadFire.on)fireball(leadFire.x-camX,leadFire.y,0,1.2);
    drawParty(camX);
    drawPlayer(camX);
    /* 導き手オロチ（浮いている） */
    if(guide){
      const gx=guide.x-camX, gy=guide.y+Math.sin(t*2.2)*8;
      const a=guide.phase===2?Math.max(0,1-guide.T/3.2):1;
      ctx.save();ctx.globalAlpha=a;
      glow(gx,gy-60,120,130,0.35,'255,240,200');
      drawAnim('orochi',gx,gy,0.95,false);
      ctx.restore();
    }
    /* 速弾きミニゲーム */
    if(mg&&mg.k==='solo'){
      const lineX=200;
      ctx.fillStyle='rgba(10,8,14,0.5)';ctx.fillRect(0,150,W,120);
      ctx.strokeStyle='rgba(255,180,140,0.85)';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(lineX,160);ctx.lineTo(lineX,260);ctx.stroke();
      for(const n of mg.notes){
        if(n.hit)continue;
        const x=lineX+(n.t-(mg.cur||0))*320;
        if(x<-40||x>W+40)continue;
        ctx.fillStyle=n.miss?'rgba(120,110,110,0.5)':'#FFD9A0';
        ctx.beginPath();ctx.arc(x,210,11,0,6.29);ctx.fill();
      }
    }
    /* マカミ: ベースライン当て */
    if(mg&&mg.k==='bass'){
      ctx.fillStyle='rgba(10,8,14,0.42)';ctx.fillRect(0,0,W,H);
      /* ロトンとマカミは端に寄せて、骨を主役に */
      drawAnim('roton_idle',150,H-60,SCALE.grave,false);
      drawAnim('makami',W-150,H-60,SCALE.grave*1.1*CHAR_SC.makami,true);
      for(let i=0;i<BONE_N;i++){
        const b=bonePos(i);
        const on=(mg.lit===i&&mg.litT>0);
        if(on){glow(b.x,b.y-24,110,90,0.9,'110,255,80');glow(b.x,b.y-24,60,50,0.9,'190,255,140');}
        ctx.save();ctx.translate(b.x,b.y);
        if(on){ctx.shadowColor='#7CFF3A';ctx.shadowBlur=28;}
        ctx.fillStyle=on?'#8CFF3A':'#DCD6C2';
        ctx.fillRect(-9,-58,18,58);
        ctx.beginPath();ctx.arc(-6,-60,10,0,6.29);ctx.fill();
        ctx.beginPath();ctx.arc(7,-60,10,0,6.29);ctx.fill();
        ctx.beginPath();ctx.arc(-6,2,10,0,6.29);ctx.fill();
        ctx.beginPath();ctx.arc(7,2,10,0,6.29);ctx.fill();
        ctx.restore();
      }
      serif(17,3);ctx.textAlign='center';
      ctx.fillStyle='rgba(255,232,196,'+(mg.phase==='show'?0.85:0.5+0.35*Math.abs(Math.sin(t*4))).toFixed(2)+')';
      ctx.fillText(mg.phase==='show'?'マカミ「……よく見て、よく聴け」':'マカミ「……真似できる？」',W/2,420);
      /* 進み具合＝骨の下の点 */
      for(let i=0;i<mg.seq.length;i++){
        ctx.fillStyle=(mg.phase==='input'&&i<mg.step)?'#FFD9A0':'rgba(200,190,170,0.35)';
        ctx.beginPath();ctx.arc(W/2-((mg.seq.length-1)*11)+i*22,450,5,0,6.29);ctx.fill();
      }
      resetLS();
    }
    /* ヘドバン */
    if(mg&&mg.k==='bang'){
      ctx.fillStyle='rgba(10,8,14,0.55)';ctx.fillRect(0,0,W,H);
      /* ロトンのアップ静止画。キーを押すたびに次のポーズへ（首＝連打そのもの） */
      const shake=Math.min(1,bangRate/8);
      glow(W/2,H/2+40,320,260,0.18+0.25*shake,'255,150,90');
      const hk='hb'+HB_SEQ[hbIdx];
      if(ok(hk)){const im=IMG[hk],h=H*0.98,w=im.naturalWidth*(h/im.naturalHeight);
        ctx.drawImage(im,W/2-w/2+Math.sin(t*40)*5*shake,H-h+8,w,h);}
      if(bangRate>7){for(let i=0;i<3;i++){const a=t*4+i*2.1;ctx.fillStyle='rgba(255,238,150,0.95)';ctx.beginPath();ctx.arc(W/2+Math.cos(a)*80,150+Math.sin(a)*22,5,0,6.29);ctx.fill();}}
      /* 説明文は出さない。仲間のかけ声で伝える（掟どおり） */
      serif(17,3);ctx.textAlign='center';
      ctx.fillStyle='rgba(255,232,196,'+(0.55+0.35*Math.abs(Math.sin(t*5))).toFixed(2)+')';
      ctx.fillText(bangRate<1?'リーリー「止まるな！　連打！！」':bangRate<6?'リーリー「もっと！　もっと！」':'リーリー「首ぃぃぃ！！」',W/2,60);
      resetLS();
    }
  }
  else if(scene==='bar'){
    bg('bgBar');
    /* タルトはカウンターの奥 */
    glow(560,300,120,60,0.22,'255,200,150');
    /* カウンターの奥に立つ（下半身はカウンターで隠れる） */
    ctx.save();ctx.beginPath();ctx.rect(0,0,W,338);ctx.clip();drawAnim('tart',556,392,0.8,false);ctx.restore();
    if(!shopOpen&&!talk&&!dlg)marker(520,395);
    drawParty();
    drawPlayer();
    if(!shopOpen&&!talk){serif(13,2);ctx.textAlign='center';ctx.fillStyle='rgba(230,220,200,0.6)';ctx.fillText('左端へ歩くと墓場へ戻る',W/2,H-16);resetLS();}
  }
  else if(scene==='stage'){
    const liveOn=(mg&&mg.k==='live'&&!mg.done);
    let mvDrawn=false;
    if(liveOn&&MV.readyState>=2){
      ctx.drawImage(MV,0,0,W,H);mvDrawn=true;
      const rem=mg.len-mg.cur; if(rem<1.2){ctx.fillStyle='rgba(0,0,0,'+Math.min(1,(1.2-rem)/1.2).toFixed(2)+')';ctx.fillRect(0,0,W,H);}
      /* 盛り上がりで画面がドクンと脈打つ */
      const hh=(mg.heat||0);
      ctx.fillStyle='rgba(255,170,90,'+(0.10*hh*Math.max(0,Math.sin(t*9))).toFixed(3)+')';ctx.fillRect(0,0,W,H);
    }
    if(!mvDrawn)bg('bgStage');
    const cr=live?live.crowd:0;
    for(let i=0;i<10;i++){
      const x=70+i*92, y=470+Math.sin(t*(3+ (live&&live.phase>=3?2.4:0))+i)*(4+10*cr*(live&&live.phase>=3?(1+ranks.bang*0.5):1));
      fireball(x,y-40,i*0.7,0.8);
    }
    if(!mvDrawn){
      glow(W/2,250,300,220,0.16+0.10*(live&&live.phase>=2?ranks.solo/3:0),'255,200,150');
      drawParty();
      drawPlayer();
    }
    /* 音ゲーのレーン */
    if(mg&&mg.k==='live'&&!mg.done){
      const lineX=170, spd=300, laneY=82;   /* 上帯（EDの字幕を隠さない） */
      ctx.fillStyle='rgba(6,5,12,0.66)';ctx.fillRect(0,laneY-52,W,104);
      ctx.strokeStyle='rgba(255,220,180,0.25)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(0,laneY);ctx.lineTo(W,laneY);ctx.stroke();
      /* 判定枠（ハマると光る） */
      const fl=Math.max(0,mg.flash||0);
      glow(lineX,laneY,54+80*fl,44+60*fl,0.30+1.2*fl,'255,220,150');
      ctx.strokeStyle='rgba(255,205,160,0.95)';ctx.lineWidth=3+6*fl;
      ctx.beginPath();ctx.arc(lineX,laneY,20+10*fl,0,6.29);ctx.stroke();
      for(const n of mg.notes){
        if(n.hit)continue;
        const x=lineX+(n.t-mg.cur)*spd;
        if(x<-400||x>W+60)continue;
        const col=n.miss?'rgba(120,112,110,0.45)':
          (n.type==='mash'?'#FF9A6A':n.type==='hold'?'#8FD8FF':n.type==='seq'?'#D6A8FF':'#FFD9A0');
        if(n.type==='hold'){
          /* 長押し＝伸ばし棒。押している間は先端から消えていく */
          const w2=(n.dur||0.8)*spd;
          const x0=n.holding?lineX:x;
          ctx.fillStyle=n.miss?'rgba(120,112,110,0.25)':(n.holding?'rgba(160,230,255,0.75)':'rgba(143,216,255,0.42)');
          ctx.beginPath();ctx.roundRect(x0,laneY-10,Math.max(0,x+w2-x0),20,10);ctx.fill();
          ctx.strokeStyle='rgba(200,240,255,0.7)';ctx.lineWidth=2;ctx.stroke();
          if(n.holding)continue;
        }
        if(n.type==='mash'){
          /* 連打＝ギザギザの帯。連打するほど埋まる */
          const w2=n.dur*spd, x1=x+w2;
          ctx.fillStyle=n.miss?'rgba(120,112,110,0.25)':'rgba(255,120,80,0.28)';
          ctx.fillRect(x,laneY-14,w2,28);
          const fill=Math.min(1,n.held/n.need);
          ctx.fillStyle='rgba(255,150,90,0.75)';ctx.fillRect(x,laneY-14,w2*fill,28);
          ctx.strokeStyle=n.miss?'rgba(120,112,110,0.4)':'#FFB08A';ctx.lineWidth=2.5;ctx.beginPath();
          for(let zx=x,k=0;zx<=x1;zx+=9,k++){ctx.lineTo(zx,laneY+(k%2?12:-12));}
          ctx.stroke();
          ctx.fillStyle='#FFF';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText('連打!',x+w2/2,laneY+5);
          continue;
        }
        if(n.type==='seq'&&n.t2!==undefined){
          const x2=lineX+(n.t2-mg.cur)*spd;
          ctx.strokeStyle=n.miss?'rgba(120,112,110,0.4)':'rgba(214,168,255,0.7)';ctx.lineWidth=2;
          ctx.beginPath();ctx.moveTo(x,laneY);ctx.lineTo(x2,laneY);ctx.stroke();
          ctx.fillStyle=col;ctx.beginPath();ctx.arc(x2,laneY,9,0,6.29);ctx.fill();
        }
        ctx.fillStyle=col;
        ctx.beginPath();ctx.arc(x,laneY,13,0,6.29);ctx.fill();
        ctx.strokeStyle='rgba(20,14,10,0.55)';ctx.lineWidth=2;ctx.stroke();
      }
      /* 判定の浮き文字 */
      for(const j of judges){
        const a=j.T/j.max, up=(1-a)*26;
        ctx.save();ctx.globalAlpha=Math.min(1,a*2);
        ctx.font=(j.big?'bold 30px':'bold 22px')+' "Hiragino Sans",sans-serif';ctx.textAlign='center';
        ctx.lineWidth=5;ctx.strokeStyle='rgba(10,8,14,0.8)';ctx.strokeText(j.s,j.x+90,j.y-30-up);
        ctx.fillStyle=j.col;ctx.fillText(j.s,j.x+90,j.y-30-up);
        ctx.restore();
      }
      /* 盛り上がりゲージ（数字なし・炎の帯） */
      const hh=(mg.heat||0);
      ctx.fillStyle='rgba(255,150,70,'+(0.25+0.5*hh).toFixed(2)+')';
      ctx.fillRect(0,H-6,W*Math.max(0.04,hh),6);
    }
  }
  else if(scene==='ending'){
    bg('bgDawn');
    /* 拾った持ち物は机の上に（絵の机: x480-670, y64-145） */
    let px2=560;
    for(const it of ITEMS){if(!items[it.k])continue;
      ctx.save();ctx.globalAlpha=0.9;drawIcon(it.k,px2,118,it.k==='light'?18:26,false);ctx.restore();px2+=44;}
    if(endPhase<4){
      drawAnim('roton_idle',430,412,SCALE.home,true);
    }
    /* 棺桶の中から蓋を閉める（社長作の内側の絵。明るい隙間が上から塞がる） */
    if(endPhase>=4){
      bg('bgCoffinIn');
      const p=Math.max(0,Math.min(1,(endT-0.8)/1.8));
      /* 隙間の台形（絵から実測・960×540換算） */
      const TL={x:159,y:124},TR={x:800,y:124},BR={x:748,y:202},BL={x:212,y:202};
      const ly=TL.y+(BL.y-TL.y)*p;
      const lx=TL.x+(BL.x-TL.x)*p, rx=TR.x+(BR.x-TR.x)*p;
      ctx.fillStyle='#231d19';
      ctx.beginPath();ctx.moveTo(TL.x-2,TL.y-2);ctx.lineTo(TR.x+2,TR.y-2);ctx.lineTo(rx+2,ly);ctx.lineTo(lx-2,ly);ctx.closePath();ctx.fill();
      /* 蓋の縁（木の板の厚み） */
      ctx.fillStyle='#3a2f27';ctx.fillRect(lx-2,ly-3,rx-lx+4,4);
      /* 箱の中が暗くなっていく */
      ctx.fillStyle='rgba(0,0,0,'+(0.72*p).toFixed(2)+')';ctx.fillRect(0,0,W,H);
      if(p>=1)ctx.fillStyle='rgba(0,0,0,'+Math.min(0.96,(endT-2.6)*1.2).toFixed(2)+')',ctx.fillRect(0,0,W,H);
    }
    if(endPhase>=5){
      ctx.fillStyle='rgba(0,0,0,0.96)';ctx.fillRect(0,0,W,H);
      ctx.globalAlpha=Math.min(1,endT/1.2);
      serif(52,12);ctx.textAlign='center';ctx.fillStyle='#E8DCC4';
      ctx.fillText('Fin.',W/2,H/2+14);
      ctx.globalAlpha=Math.min(1,Math.max(0,(endT-2.2)*0.6));
      serif(15,4);ctx.fillStyle='#B9AE99';
      ctx.fillText(isTouch?'タップでもう一度':'クリックでもう一度',W/2,H-56);
      ctx.globalAlpha=1;resetLS();
    }
  }

  /* きらり・花びら */
  for(const s of sparks){
    const a=Math.max(0,s.T/s.max),r=5.5*s.s*(0.55+0.75*(1-a));
    const ox=(scene==='grave')?camX:0;
    ctx.strokeStyle='rgba(255,242,178,'+(a*0.95).toFixed(3)+')';ctx.lineWidth=1.7*s.s;
    ctx.beginPath();
    ctx.moveTo(s.x-ox-r,s.y);ctx.lineTo(s.x-ox+r,s.y);
    ctx.moveTo(s.x-ox,s.y-r);ctx.lineTo(s.x-ox,s.y+r);
    ctx.stroke();
  }
  for(const m of motes){
    const a=Math.max(0,m.T/m.max);
    const ox=(scene==='grave')?camX:0;
    ctx.fillStyle=(m.c||'#fff')+'';
    ctx.globalAlpha=a*0.85;
    ctx.beginPath();ctx.arc(m.x-ox,m.y,3.2,0,6.29);ctx.fill();
    ctx.globalAlpha=1;
  }

  drawCans();
  drawShop();
  drawFlyerZoom();
  drawBigNum();
  drawTelop();
  drawDlg();
  drawTalk();
  drawMovie();
  drawCut();
  drawMgIntro();
  drawGetPop();
  drawBanner();
  drawCelebrate();
  drawClear();

  if(fade>0){ctx.fillStyle='rgba(6,5,10,'+fade.toFixed(3)+')';ctx.fillRect(0,0,W,H);}
}

/* エンディング後のリスタート */
cv.addEventListener('pointerdown',()=>{
  if(scene==='ending'&&endPhase>=5&&endT>2.6)location.reload();
});

/* ================= デバッグ ================= */
window._dbg={
  st:()=>({scene,x:Math.round(player.x),y:Math.round(player.y),camX:Math.round(camX),
    skills,ranks,tension,cans:cansHeld,party:party.slice(),lyric,
    mg:mg?mg.k:null,dlg:dlg?dlg.i:null,talk:talk?talk.i:null,live:live?live.phase:null,endPhase,items,met,idle:idleT.toFixed(1)}),
  go:(s)=>{const sp={home:[300,470],alley:[760,470],grave:[120,470],stage:[300,470],ending:[300,470],bar:[300,480]};
    scene=s;pendingScene=null;fade=0;fadeDir=0;camX=0;
    if(sp[s]){player.x=sp[s][0];player.y=sp[s][1];}
    if(s==='stage')stageEnter(); if(s==='ending'){endT=0;endPhase=0;}},
  at:(x)=>{player.x=x;},
  learn:()=>{skills.lyric=skills.solo=skills.bang=skills.bass=true;ranks={lyric:2,solo:2,bang:2,bass:2};
    met={mitama:true,narukami:true,lili:true,makami:true};
    lyric='漆黒の翼で、夜を斬る';
    ['mitama','narukami','lili','makami'].forEach((k,i)=>join(k,player.x-40*(i+1)));},
  talkSkip:()=>{while(talk){talk.t=1;advanceTalk();}},
  clear:()=>{cut=null;movie=null;celebrate=null;getPop=null;banner=null;mgIntro=null;clearScr=null;guide=null;guideDone=true;},
  cans:(n)=>{cansHeld=n;},
  gear:()=>{flyerSeen=true;mission=true;items={fan:true,spray:true,light:true};ready=true;},
  skip:()=>{while(dlg){dlg.t=1;advanceDlg();}}
};

/* ================= ループ ================= */
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  update(dt);draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
